<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fffaf7">
  <title>Nailly account link</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .confirm-shell{width:min(560px,100%);background:#fff;border:1px solid #f2e6e3;border-radius:32px;padding:44px;box-shadow:0 30px 80px rgba(69,38,56,.12);text-align:center}
    .confirm-icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;background:#fce8e4;color:#ec817a;font-size:30px;font-weight:900}
    .confirm-shell h1{font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1.02;font-weight:500;letter-spacing:-.035em;margin:0;color:#452638}
    .confirm-shell p{color:#877582;line-height:1.7;margin:18px auto 0;max-width:430px}
    .confirm-actions{display:grid;gap:10px;margin-top:30px}
    .confirm-primary,.confirm-secondary{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:15px;font-weight:800;font-size:13px}
    .confirm-primary{background:#ec817a;color:#fff}
    .confirm-secondary{border:1px solid #f2e6e3;color:#452638;background:#fffaf7}
    .confirm-foot{margin-top:24px;font-size:10px!important;color:#b09fa8!important}
    .mini-brand{font-size:24px;margin-bottom:28px}
    .error-state .confirm-icon{background:#fff0ee;color:#c54f54}
    @media(max-width:560px){.confirm-shell{padding:34px 22px;border-radius:26px}.confirm-shell h1{font-size:38px}}
  </style>
</head>
<body>
  <main class="confirm-shell" id="card">
    <div class="mini-brand">nailly<span>.</span></div>
    <div class="confirm-icon" id="icon">✓</div>
    <h1 id="title">Email confirmed</h1>
    <p id="message">Your Nailly account is ready. You can return to the app and continue signing in.</p>

    <div class="confirm-actions">
      <a class="confirm-primary" id="open-app" href="nailly://auth/callback">Open Nailly</a>
      <a class="confirm-secondary" href="../../">Back to naillyapp.com</a>
    </div>

    <p class="confirm-foot">If Nailly is not installed on this device, open the app on your phone and sign in with the email you just confirmed.</p>
  </main>

  <script>
    const search = window.location.search || '';
    const hash = window.location.hash || '';
    const params = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
    const query = new URLSearchParams(search);
    const error = query.get('error_description') || query.get('error') || params.get('error_description') || params.get('error');
    const type = query.get('type') || params.get('type');

    const openApp = document.getElementById('open-app');
    openApp.href = 'nailly://auth/callback' + search + hash;

    if (type === 'recovery' && !error) {
      document.title = 'Reset your password — Nailly';
      document.getElementById('icon').textContent = '✦';
      document.getElementById('title').textContent = 'Password reset';
      document.getElementById('message').textContent = 'Your secure recovery link is ready. Open Nailly to choose a new password.';
      openApp.textContent = 'Open Nailly to reset password';
    }

    if (error) {
      const card = document.getElementById('card');
      card.classList.add('error-state');
      document.getElementById('icon').textContent = '!';
      document.getElementById('title').textContent = 'Confirmation issue';
      document.getElementById('message').textContent = error;
      openApp.textContent = 'Open Nailly';
    }
  </script>
</body>
</html>
